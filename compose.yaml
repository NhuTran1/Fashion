name: fashioncommerce

services:
  mysql:
    # MySQL lưu dữ liệu InnoDB trong volume Docker cục bộ.
    image: mysql:8.4.13
    command: ["--default-storage-engine=InnoDB"]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-fashioncommerce_dev}
      MYSQL_USER: ${DB_USER:-fashioncommerce_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the local .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the local .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Kiểm tra truy vấn TCP bằng tài khoản ứng dụng sau khi MySQL khởi tạo.
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}" --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" > /dev/null
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
